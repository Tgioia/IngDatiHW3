plugins {
    id 'java'
    id 'application'
}

group = 'it.uniroma3.ingdati'
version = '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

def luceneVersion = '9.12.0'

dependencies {
    implementation "org.apache.lucene:lucene-core:${luceneVersion}"
    implementation "org.apache.lucene:lucene-queryparser:${luceneVersion}"
    implementation "org.apache.lucene:lucene-analysis-common:${luceneVersion}"
    implementation "org.apache.lucene:lucene-codecs:${luceneVersion}"
}

application {
    mainClass = 'it.uniroma3.ingdati.hw3.Main'
}

tasks.register('indexer', JavaExec) {
    mainClass = 'it.uniroma3.ingdati.hw3.FileIndexer'
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('searcher', JavaExec) {
    mainClass = 'it.uniroma3.ingdati.hw3.FileSearcher'
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
}

tasks.register('testQueries', JavaExec) {
    mainClass = 'it.uniroma3.ingdati.hw3.QueryTester'
    classpath = sourceSets.main.runtimeClasspath
}
